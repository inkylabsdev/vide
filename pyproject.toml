[project]
name = "vide-python"
version = "0.1.0"
description = "A video editing utility"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "ffmpeg-python>=0.2.0",
    "replicate>=1.0.7",
    "scenedetect[opencv]>=0.6.4",
]

[project.scripts]
vide = "vide.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vide"]

[tool.pytest.ini_options]
addopts = "--cov=vide --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "shibuya>=2026.7.12",
    "sphinx>=9.1.0",
]
