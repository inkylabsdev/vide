[project]
name = "vide-python"
version = "0.1.0"
description = "A video editing utility"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "ffmpeg-python>=0.2.0",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pillow>=10.0",
    "replicate>=1.0.7",
    "scenedetect[opencv]>=0.6.4",
    "torch>=2.4",
    "transformers>=4.45",
]

[project.scripts]
vide = "vide.cli:cli"

[tool.uv.sources]
# CPU wheels on Linux (CI); the default CUDA wheels are ~2.5 GB.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vide"]

[tool.pytest.ini_options]
addopts = "--cov=vide --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
    "shibuya>=2026.7.12",
    "sphinx>=9.1.0",
]
