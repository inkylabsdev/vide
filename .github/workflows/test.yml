name: Tests

# Runs the pytest suite on every pull request and every push to main.
# ffmpeg is needed for the end-to-end split/merge tests; libgl1 is an
# opencv-python (scenedetect backend) runtime dependency.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1

      - name: Run tests
        run: uv run pytest
